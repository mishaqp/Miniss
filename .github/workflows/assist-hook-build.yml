name: Build Assist Hook

on:
  push:
    branches:
      - fix/system-assist-launch-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build hook
        working-directory: src/android
        run: ./gradlew :assist-hook:assembleDebug --no-daemon --stacktrace
      - name: Upload hook APK
        uses: actions/upload-artifact@v4
        with:
          name: Miniss-Assist-Hook-debug
          path: src/android/assist-hook/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
