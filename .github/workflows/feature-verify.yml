name: Verify Miniss Codex UI + System Assist

on:
  push:
    branches:
      - feature/codex-ui-system-assist
    paths:
      - .github/workflows/feature-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Fix resources and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/codex-ui-system-assist
          submodules: recursive
          fetch-depth: 0

      - name: Fix System Assist settings resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          values = Path('src/android/app/src/main/res/values/strings.xml')
          ru = Path('src/android/app/src/main/res/values-ru/strings.xml')

          additions = [
              (values, '    <string name="settings_system_permissions_subtitle">Accessibility and assistant screen capture</string>\n'),
              (ru, '    <string name="settings_system_permissions_subtitle">Спецвозможности и захват экрана ассистентом</string>\n'),
          ]

          for path, line in additions:
              text = path.read_text()
              if 'name="settings_system_permissions_subtitle"' in text:
                  continue
              marker = '</resources>'
              if marker not in text:
                  raise SystemExit(f'{path}: closing resources tag not found')
              text = text.replace(marker, line + marker, 1)
              path.write_text(text)
          PY

      - name: Commit resource fix
        shell: bash
        run: |
          if git diff --quiet -- src/android/app/src/main/res/values/strings.xml src/android/app/src/main/res/values-ru/strings.xml; then
            echo "No resource changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/android/app/src/main/res/values/strings.xml src/android/app/src/main/res/values-ru/strings.xml
            git commit -m "fix(assist): add system permissions settings subtitle"
            git push origin HEAD:feature/codex-ui-system-assist
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.0.13004108"

      - name: Prepare sandbox and native dependencies
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          chmod +x scripts/prepare_android_sandbox.sh deps/build_proot.sh deps/build_rclone_android.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_proot.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          PATH="$(go env GOPATH)/bin:$PATH" ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar

      - name: Build debug APK
        working-directory: src/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miniss-1.13-root-codex-assist-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
