name: Build Miniss Root + Codex

on:
  push:
    branches:
      - work/miniss-1.13-codex-root
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.0.13004108"

      - name: Prepare sandbox and native dependencies
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          chmod +x scripts/prepare_android_sandbox.sh deps/build_proot.sh deps/build_rclone_android.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_proot.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          PATH="$(go env GOPATH)/bin:$PATH" ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar

      # The public upstream unit suite needs a private Claude OAuth build-time
      # customization and currently contains unrelated baseline failures.
      # assembleDebug is the blocking compile + native-link verification for this fork.
      - name: Build debug APK
        working-directory: src/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miniss-1.13-root-codex-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
